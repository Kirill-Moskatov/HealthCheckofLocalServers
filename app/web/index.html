<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse — Мониторинг сервисов</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding: 16px 24px;
            background-color: var(--md-sys-color-surface);
            border-radius: var(--md-sys-shape-corner-large);
            box-shadow: var(--md-sys-elevation-1);
        }

        .header__title {
            font: var(--md-sys-typescale-headline-large);
            color: var(--md-sys-color-primary);
        }

        .header__summary {
            display: flex;
            gap: 24px;
        }

        .summary-item {
            text-align: center;
        }

        .summary-item__value {
            font: var(--md-sys-typescale-display-medium);
            color: var(--md-sys-color-primary);
        }

        .summary-item__label {
            font: var(--md-sys-typescale-body-medium);
            color: var(--md-sys-color-on-surface-variant);
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .service-card {
            background-color: var(--md-sys-color-surface);
            border-radius: var(--md-sys-shape-corner-large);
            padding: 24px;
            box-shadow: var(--md-sys-elevation-1);
            transition: box-shadow 0.2s ease;
        }

        .service-card:hover {
            box-shadow: var(--md-sys-elevation-2);
        }

        .service-card--up {
            border-left: 4px solid var(--md-sys-color-success);
        }

        .service-card--down {
            border-left: 4px solid var(--md-sys-color-error);
        }

        .service-card--unknown {
            border-left: 4px solid var(--md-sys-color-secondary);
        }

        .service-card__header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .service-card__name {
            font: var(--md-sys-typescale-title-large);
            color: var(--md-sys-color-on-surface);
        }

        .service-card__status {
            padding: 6px 16px;
            border-radius: var(--md-sys-shape-corner-small);
            font: var(--md-sys-typescale-label-large);
            text-transform: uppercase;
        }

        .service-card__status--up {
            background-color: var(--md-sys-color-success-container);
            color: var(--md-sys-color-on-success-container);
        }

        .service-card__status--down {
            background-color: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
        }

        .service-card__status--unknown {
            background-color: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface-variant);
        }

        .service-card__url {
            font: var(--md-sys-typescale-body-medium);
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 16px;
            word-break: break-all;
        }

        .service-card__metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        .metric {
            text-align: center;
            padding: 12px;
            background-color: var(--md-sys-color-surface-variant);
            border-radius: var(--md-sys-shape-corner-medium);
        }

        .metric__value {
            font: var(--md-sys-typescale-title-medium);
            color: var(--md-sys-color-on-surface);
        }

        .metric__label {
            font: var(--md-sys-typescale-body-medium);
            color: var(--md-sys-color-on-surface-variant);
            margin-top: 4px;
        }

        .service-card__downtime {
            font: var(--md-sys-typescale-body-medium);
            color: var(--md-sys-color-error);
            margin-bottom: 16px;
        }

        .service-card__uptime-bar {
            height: 8px;
            background-color: var(--md-sys-color-surface-variant);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .service-card__uptime-fill {
            height: 100%;
            background-color: var(--md-sys-color-success);
            transition: width 0.3s ease;
        }

        .service-card__actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--md-sys-shape-corner-small);
            font: var(--md-sys-typescale-label-large);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn--primary {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }

        .btn--primary:hover {
            box-shadow: var(--md-sys-elevation-1);
        }

        .btn--tonal {
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }

        .btn--tonal:hover {
            box-shadow: var(--md-sys-elevation-1);
        }

        /* Incidents Feed */
        .incidents-section {
            background-color: var(--md-sys-color-surface);
            border-radius: var(--md-sys-shape-corner-large);
            padding: 24px;
            margin-bottom: 32px;
            box-shadow: var(--md-sys-elevation-1);
        }

        .section-title {
            font: var(--md-sys-typescale-headline-medium);
            color: var(--md-sys-color-on-surface);
            margin-bottom: 24px;
        }

        .incidents-list {
            list-style: none;
        }

        .incident-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--md-sys-color-surface-variant);
        }

        .incident-item:last-child {
            border-bottom: none;
        }

        .incident-item__info {
            flex: 1;
        }

        .incident-item__service {
            font: var(--md-sys-typescale-title-medium);
            color: var(--md-sys-color-on-surface);
        }

        .incident-item__time {
            font: var(--md-sys-typescale-body-medium);
            color: var(--md-sys-color-on-surface-variant);
            margin-top: 4px;
        }

        .incident-item__duration {
            font: var(--md-sys-typescale-label-large);
            padding: 6px 12px;
            border-radius: var(--md-sys-shape-corner-small);
            background-color: var(--md-sys-color-error-container);
            color: var(--md-sys-color-on-error-container);
        }

        /* Notifications Log */
        .notifications-section {
            background-color: var(--md-sys-color-surface);
            border-radius: var(--md-sys-shape-corner-large);
            padding: 24px;
            box-shadow: var(--md-sys-elevation-1);
        }

        .notifications-list {
            list-style: none;
        }

        .notification-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            border-bottom: 1px solid var(--md-sys-color-surface-variant);
        }

        .notification-item:last-child {
            border-bottom: none;
        }

        .notification-item__icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .notification-item__icon--down {
            background-color: var(--md-sys-color-error-container);
            color: var(--md-sys-color-error);
        }

        .notification-item__icon--up {
            background-color: var(--md-sys-color-success-container);
            color: var(--md-sys-color-success);
        }

        .notification-item__icon--digest {
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-primary);
        }

        .notification-item__content {
            flex: 1;
        }

        .notification-item__message {
            font: var(--md-sys-typescale-body-large);
            color: var(--md-sys-color-on-surface);
        }

        .notification-item__time {
            font: var(--md-sys-typescale-body-medium);
            color: var(--md-sys-color-on-surface-variant);
            margin-top: 4px;
        }

        /* Skeleton loading */
        .skeleton {
            background: linear-gradient(90deg, 
                var(--md-sys-color-surface-variant) 25%, 
                var(--md-sys-color-outline) 50%, 
                var(--md-sys-color-surface-variant) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: var(--md-sys-shape-corner-small);
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton--text {
            height: 20px;
            margin-bottom: 8px;
        }

        .skeleton--title {
            height: 32px;
            margin-bottom: 16px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 16px;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }

            .service-card__metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="header__title">Pulse</h1>
            <div class="header__summary">
                <div class="summary-item">
                    <div class="summary-item__value" id="services-online">-</div>
                    <div class="summary-item__label">В строю</div>
                </div>
                <div class="summary-item">
                    <div class="summary-item__value" id="services-total">-</div>
                    <div class="summary-item__label">Всего</div>
                </div>
            </div>
        </header>

        <!-- Services Grid -->
        <main class="services-grid" id="services-container">
            <!-- Service cards will be rendered here -->
        </main>

        <!-- Incidents Feed -->
        <section class="incidents-section">
            <h2 class="section-title">Последние инциденты</h2>
            <ul class="incidents-list" id="incidents-list">
                <!-- Incidents will be rendered here -->
            </ul>
        </section>

        <!-- Notifications Log -->
        <section class="notifications-section">
            <h2 class="section-title">Уведомления (MAX мок)</h2>
            <ul class="notifications-list" id="notifications-list">
                <!-- Notifications will be rendered here -->
            </ul>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
